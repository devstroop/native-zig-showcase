name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # The SDK release the apps are authored against. The CLI is built from
  # this tag because the published npm tarball ships without the SDK's
  # tests/ fixtures that `native test` compiles, while a source checkout
  # carries them.
  NATIVE_SDK_TAG: v0.11.0
  # The Zig version the SDK pins (src/tooling/toolchain.zig
  # pinned_zig_version); the CLI rejects any other minor version. 0.17
  # does not build this SDK (verified: `zig build` fails to parse it).
  NATIVE_ZIG_VERSION: "0.16.0"

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64-linux
          - os: macos-14
            arch: aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        uses: vercel-labs/setup-zig@v1
        with:
          version: ${{ env.NATIVE_ZIG_VERSION }}
      - name: Install GTK and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev xvfb
      - name: Restore the Native SDK checkout
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/native-sdk
          key: native-sdk-${{ runner.os }}-${{ env.NATIVE_SDK_TAG }}-zig${{ env.NATIVE_ZIG_VERSION }}-b1
      - name: Fetch and build the SDK CLI
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_TAG" https://github.com/vercel-labs/native.git "$HOME/native-sdk"
          cd "$HOME/native-sdk"
          zig build -Doptimize=ReleaseFast
      - name: Put the SDK CLI on PATH
        run: |
          test -x "$HOME/native-sdk/zig-out/bin/native"
          echo "$HOME/native-sdk/zig-out/bin" >> "$GITHUB_PATH"
      - name: Cache the Zig compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-cache-${{ runner.os }}-${{ env.NATIVE_SDK_TAG }}-zig${{ env.NATIVE_ZIG_VERSION }}
      - name: Build every app in ReleaseFast
        run: bash scripts/build-all.sh
      - name: Package the binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for app in apps/*/; do
            name="$(basename "$app")"
            tar -czf "dist/${name}-${{ matrix.arch }}.tar.gz" -C "$app/zig-out/bin" "$name"
          done
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum ./*.tar.gz) > "dist/SHA256SUMS-${{ matrix.arch }}.txt"
          else
            (cd dist && shasum -a 256 ./*.tar.gz) > "dist/SHA256SUMS-${{ matrix.arch }}.txt"
          fi
      - name: Upload the packaged apps
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the packaged apps
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
